name: NPM Staged Publish
description: Install dependencies, run lint/test/build, and stage a publish to the NPM registry with provenance.

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
  node-version-file:
    description: 'Path to package.json'
    default: 'package.json'
    required: false
  npm-token:
    description: 'NPM auth token for staged publishing'
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        registry-url: 'https://registry.npmjs.org'
    - shell: bash
      run: pnpm install
    - shell: bash
      run: pnpm run --if-present lint
    - shell: bash
      run: pnpm run --if-present test
    - shell: bash
      run: pnpm run --if-present build
    - shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      run: pnpm stage publish --access public --no-git-checks --provenance
